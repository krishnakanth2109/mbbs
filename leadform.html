  <!-- Lead Form Section -->
  <section id="lead-form" class="mt-12 bg-gradient-to-r from-indigo-600 to-blue-600 text-white p-8 rounded-lg shadow-lg animate-fadeInUp">
    <h2 class="text-3xl font-bold mb-4 text-center">Get in Touch</h2>
    <form class="max-w-lg mx-auto bg-white text-gray-800 p-6 rounded-lg shadow-lg" onsubmit="return validateForm()">
      <div class="mb-4">
        <label for="name" class="block text-sm font-bold text-gray-700">Name</label>
        <input type="text" id="name" name="name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 transition" required>
      </div>
      <div class="mb-4">
        <label for="email" class="block text-sm font-bold text-gray-700">Email</label>
        <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 transition" required>
      </div>
      <div class="mb-4">
        <label for="phone" class="block text-sm font-bold text-gray-700">Phone</label>
        <input type="tel" id="phone" name="phone" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 transition" required>
      </div>
      <div class="mb-4">
        <label for="country" class="block text-sm font-bold text-gray-700">Preferred Country</label>
        <select id="country" name="country" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 transition" required>
          <option value="">Select a country</option>
          <option value="Russia">Russia</option>
          <option value="Uzbekistan">Uzbekistan</option>
          <option value="Kazakhstan">Kazakhstan</option>
          <option value="Philippines">Philippines</option>
          <option value="Georgia">Georgia</option>
          <option value="Kyrgyzstan">Kyrgyzstan</option>
          <option value="Egypt">Egypt</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transform hover:scale-105 transition">Submit</button>
    </form>
  </section>
